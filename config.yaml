# ── IVC: pesos explícitos (no son uniformes) ─────────────────────────────────
# El índice publicado es el promedio ponderado de los seis subíndices.
# idx_riesgo_clima pesa la mitad que los demás y, sin pluviometría, vale 0.5
# constante. No describir estos pesos como uniformes.
ivc:
  pesos:
    idx_desempleo: 1.0
    idx_habitat: 1.0
    idx_educacion: 1.0
    idx_riesgo_clima: 0.5
    idx_pobreza: 1.0
    idx_tejido_social: 1.0

# ── Lluvia SIATA: dentro del índice O como predictor, nunca ambos ────────────
# ninguno    : no entra lluvia (subíndice climático queda en el valor del CSV).
# subindice  : la lluvia define idx_riesgo_clima y por tanto el IVC; no es feature.
# predictor  : la lluvia es feature de t→t+1; idx_riesgo_clima sale de los features.
clima:
  uso: ninguno
