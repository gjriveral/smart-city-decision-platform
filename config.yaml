# ── Parámetros de simulación ABM ──────────────────────────────────────────────
# Fuente única para horizonte, presupuesto, réplicas Monte Carlo y escenarios.
# abm/04_urban_model.py y los barridos de sensibilidad leen esta sección vía
# config_loader (ya no usan literales ANNUAL_BUDGET / N_YEARS / SCENARIOS).
simulacion:
  horizonte_anios: 10
  presupuesto_anual: 1000000          # COP (millones) por año
  n_replicas_montecarlo: 30
  escenarios:
    - id: focalizado
      nombre: "Focalizado — Optimización Algorítmica"
      # peso = ρ: fracción del presupuesto concentrada en el top-5
      peso: 0.80
    - id: distribuido
      nombre: "Distribuido — Igualitario"
      # peso no aplica (reparto uniforme); se declara 0 por trazabilidad
      peso: 0.0
    - id: adaptativo
      nombre: "Adaptativo — Híbrido"
      # peso no aplica (heurística IVC × eficiencia); 0 por trazabilidad
      peso: 0.0
  # Tope de eficacia η(C)=min(1, eta_intercepto−C). El código anterior lo
  # aplicaba siempre; el texto del artículo lo daba por desactivado.
  saturacion:
    activa: false
    eta_intercepto: 1.5
  # ε_t = clip(1+N(0, desviacion²), 0.85, 1.15). 0 deja el IVC determinista.
  ruido:
    desviacion: 0.05
  # Quién entra al top prioritario del escenario focalizado.
  #   dynamic_ivc : reordena cada año por el IVC corriente (texto del artículo).
  #   fixed_shap  : fija el top una sola vez con la suma SHAP (código anterior).
  # reparto: igual (partes iguales dentro del top) | proporcional (al score).
  focalizado_ranking:
    regla: dynamic_ivc
    n_prioritarios: 5
    reparto: igual
  # Escenario stub. El CSV no está en el repositorio; si falta, se omite.
  inversion_historica:
    ruta: "data/external/inversion_historica_por_territorio.csv"
    tipo_anio: calendario
    anio_inicio: 2013

